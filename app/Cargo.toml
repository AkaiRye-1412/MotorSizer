[package]
name = "motor-selection"
version = "2.0.3"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
serde_json = "1"

[profile.release]
opt-level = 2
