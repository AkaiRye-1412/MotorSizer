[package]
name = "motor-selection"
version = "2.0.3"
edition = "2021"

[build-dependencies]
winres = "0.1"

[dependencies]
calamine = "0.38.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
encoding_rs = "0.8"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
rust_xlsxwriter = "0.102.0"
serde_json = "1"

[profile.release]
opt-level = 2
